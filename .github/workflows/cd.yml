name: CD - Deploy External Data Ingestion Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=2 \
            ec2-user@13.204.82.83 << 'EOF'

              set -e
              echo "🚀 Connected to EC2"

              cd ~/external_data_ingestion_pipeline

              echo "🔄 Sync EC2 repo with GitHub (SOURCE OF TRUTH)"
              git fetch origin
              git checkout main || git checkout -b main
              git reset --hard origin/main
              git clean -fd

              echo "🔧 Ensure deployment script executable"
              chmod +x scripts/run_project.sh

              echo "▶ Running deployment script"
              ./scripts/run_project.sh

              echo "✅ Deployment completed successfully"
          EOF
